<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#160a12">
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#160a12; --bg2:#22101b; --surface:#2b1522; --line:#ff6b9d33;
  --rose:#ff6b9d; --rose-d:#e0457d; --blush:#ffd0e0; --muted:#c79aae; --gold:#f2c6a0;
  --ok:#7fd8a6; --danger:#ff7a8a;
  --r:18px;
  --head:'Aref Ruqaa','Segoe UI',serif;
  --body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;font-family:var(--body);color:var(--blush);line-height:1.7;
  background:
    radial-gradient(900px 500px at 85% -10%,#ff6b9d26,transparent 60%),
    radial-gradient(700px 500px at -10% 110%,#b0306a22,transparent 60%),
    var(--bg);
  padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px));
}
.wrap{max-width:640px;margin:auto}
h1,h2{font-family:var(--head);font-weight:700;margin:0}
h1{font-size:2rem;color:var(--blush)}
h2{font-size:1.35rem;color:var(--blush)}
small,.muted{color:var(--muted);font-size:.82rem}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* inputs */
input,textarea{
  width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--bg2);color:var(--blush);font:inherit;transition:border-color .2s,box-shadow .2s;
}
input::placeholder,textarea::placeholder{color:#c79aae88}
input:focus,textarea:focus{outline:0;border-color:var(--rose);box-shadow:0 0 0 4px #ff6b9d26}
input[type=datetime-local]{color-scheme:dark}
textarea{resize:vertical;min-height:140px}
label{display:block;margin:14px 0 6px;font-size:.9rem;color:var(--muted)}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:13px 18px;border:0;border-radius:14px;cursor:pointer;font:inherit;font-weight:600;color:#fff;
  background:linear-gradient(135deg,var(--rose),var(--rose-d));
  box-shadow:0 8px 22px -8px #ff6b9d99;transition:transform .15s,box-shadow .2s,opacity .2s;
}
.btn:hover{box-shadow:0 12px 26px -8px #ff6b9dcc}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;box-shadow:none;border:1px solid var(--line);color:var(--muted)}
.btn.ghost:hover{color:var(--blush);border-color:var(--rose)}
.spin{width:16px;height:16px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* login */
#login{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.login-card{
  background:linear-gradient(160deg,#ff6b9d1c,#ff6b9d0a);border:1px solid var(--line);
  border-radius:24px;padding:28px 22px;backdrop-filter:blur(8px);
}
.login-card .sub{margin:4px 0 18px;color:var(--muted)}
.login-card .btn{margin-top:14px}
.seal{
  width:54px;height:54px;border-radius:50%;margin-bottom:14px;display:grid;place-items:center;font-size:1.5rem;
  background:radial-gradient(circle at 30% 30%,#ff9cc0,var(--rose-d));box-shadow:0 6px 18px -4px #ff6b9d99;
}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.top .btn{width:auto;padding:8px 16px;font-size:.85rem}

/* letter composer */
.letter{
  position:relative;background:linear-gradient(180deg,#34182a,var(--surface));
  border:1px solid var(--line);border-radius:var(--r);padding:20px 18px 18px;
  box-shadow:0 18px 40px -22px #000;
}
.letter::before{
  content:"";position:absolute;inset:8px;border:1px dashed #ff6b9d22;border-radius:12px;pointer-events:none;
}
.letter h2{margin-bottom:10px}
.letter textarea{background:#1c0d16;position:relative}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.send{margin-top:16px;position:relative}

/* tabs */
.tabs{display:flex;gap:6px;margin:28px 0 12px;padding:5px;background:var(--bg2);border:1px solid var(--line);border-radius:16px}
.tab{
  flex:1;padding:10px 8px;border:0;border-radius:12px;background:transparent;color:var(--muted);
  font:inherit;font-weight:500;cursor:pointer;transition:background .2s,color .2s;
}
.tab[aria-selected=true]{background:var(--rose);color:#fff;font-weight:600}
.count{display:inline-block;min-width:22px;padding:0 6px;margin-inline-start:4px;border-radius:99px;background:#ffffff26;font-size:.78rem}

/* cards */
.card{
  background:#ff6b9d14;border:1px solid #ff8cb42e;border-radius:var(--r);padding:14px 16px;margin:10px 0;
  white-space:pre-wrap;word-break:break-word;
}
.quote{
  display:block;margin-bottom:8px;padding:6px 10px;border-inline-start:3px solid var(--rose);
  background:#00000026;border-radius:8px;color:var(--muted);font-size:.85rem;
}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.badge{padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:500}
.badge.lock{background:#f2c6a01f;color:var(--gold)}
.badge.open{background:#7fd8a61a;color:var(--ok)}
.del{
  border:1px solid transparent;background:transparent;color:var(--muted);padding:4px 12px;border-radius:10px;
  font:inherit;font-size:.82rem;cursor:pointer;transition:all .2s;
}
.del:hover{color:var(--danger);border-color:#ff7a8a55}
.del.sure{background:var(--danger);color:#fff}
.empty{text-align:center;padding:36px 12px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;font-size:2rem;margin-bottom:4px}
.sk{height:78px;border-radius:var(--r);margin:10px 0;background:linear-gradient(90deg,#ff6b9d0f,#ff6b9d22,#ff6b9d0f);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* toast */
#toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);
  background:#2b1522;border:1px solid var(--line);color:var(--blush);padding:12px 20px;border-radius:14px;
  box-shadow:0 14px 30px -10px #000;opacity:0;pointer-events:none;transition:all .3s;z-index:9;max-width:90vw;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:var(--danger);color:#ffc2c9}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <!-- Login -->
  <div id="login">
    <div class="login-card">
      <div class="seal">💌</div>
      <h1>أهلاً بيك</h1>
      <p class="sub">سجّل دخولك علشان تكتب رسايلك وتقرا الردود.</p>
      <input id="em" type="email" placeholder="الإيميل" autocomplete="username" dir="ltr">
      <input id="pw" type="password" placeholder="الباسورد" autocomplete="current-password" dir="ltr" style="margin-top:10px">
      <button class="btn" id="loginBtn">دخول</button>
    </div>
  </div>

  <!-- App -->
  <div id="app" hidden>
    <div class="top">
      <h1>رسايلك</h1>
      <button class="btn ghost" id="logoutBtn">خروج</button>
    </div>

    <section class="letter">
      <h2>✍️ رسالة جديدة</h2>
      <textarea id="txt" placeholder="اكتب الرسالة..."></textarea>
      <div class="row"><small id="cnt">0 حرف</small></div>
      <label for="unlock">تتفتح في تاريخ معين (اختياري، سيبه فاضي لو عايزها تظهر فوراً)</label>
      <input id="unlock" type="datetime-local">
      <button class="btn send" id="sendBtn">إرسال 💌</button>
    </section>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="replies">📥 الردود <span class="count" id="c-rep">0</span></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="msgs">📤 رسايلك <span class="count" id="c-msg">0</span></button>
    </div>

    <div id="replies" role="tabpanel"></div>
    <div id="msgs" role="tabpanel" hidden></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
const SB_URL = "https://lblzkdbbmgvcscipmvev.supabase.co";
const SB_KEY = "sb_publishable_x7SR5s3ETJEnhX_Rt013JA_RF2FFTw-";

const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; };
const fmt = d => new Date(d).toLocaleString("ar-EG", { dateStyle: "medium", timeStyle: "short" });

let session = null, timer = null;
try { session = JSON.parse(localStorage.getItem("adm_session")); } catch (e) {}

/* ---------- UI helpers ---------- */
let toastT;
function toast(msg, isErr) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "show" + (isErr ? " err" : "");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.className = "", 2800);
}
function busy(btn, on, label) {
  btn.disabled = on;
  btn.innerHTML = on ? '<span class="spin"></span>' : label;
}
const skeleton = '<div class="sk"></div><div class="sk"></div>';

/* ---------- Auth ---------- */
function saveSession(s) {
  session = s;
  try { localStorage.setItem("adm_session", JSON.stringify(s)); } catch (e) {}
}

async function login() {
  const btn = $("loginBtn");
  busy(btn, true);
  try {
    const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { apikey: SB_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email: $("em").value.trim(), password: $("pw").value })
    });
    const d = await r.json();
    if (!r.ok || !d.access_token) { toast("الإيميل أو الباسورد غلط", true); return; }
    saveSession({ access_token: d.access_token, refresh_token: d.refresh_token });
    init();
  } catch (e) {
    toast("مفيش اتصال بالنت، جرّب تاني", true);
  } finally {
    busy(btn, false, "دخول");
  }
}

async function refresh() {
  if (!session || !session.refresh_token) return false;
  const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, {
    method: "POST",
    headers: { apikey: SB_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: session.refresh_token })
  });
  const d = await r.json();
  if (!r.ok || !d.access_token) return false;
  saveSession({ access_token: d.access_token, refresh_token: d.refresh_token });
  return true;
}

async function api(path, opts = {}, retry = true) {
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      apikey: SB_KEY,
      Authorization: "Bearer " + (session ? session.access_token : ""),
      "Content-Type": "application/json",
      ...(opts.headers || {})
    }
  });
  if (r.status === 401 && retry && await refresh()) return api(path, opts, false);
  return r;
}

function logout() {
  try { localStorage.removeItem("adm_session"); } catch (e) {}
  location.reload();
}

/* ---------- Data ---------- */
const empty = (icon, text) => `<div class="empty"><b>${icon}</b>${text}</div>`;

async function load() {
  try {
    const r = await api("replies?select=*&order=created_at.desc");
    if (r.status === 401) return logout();
    const rep = await r.json();
    const reps = Array.isArray(rep) ? rep : [];
    $("c-rep").textContent = reps.length;
    $("replies").innerHTML = reps.length ? reps.map(x => `
      <div class="card">
        ${x.reply_to_text ? `<span class="quote">↩ ${esc(x.reply_to_text.slice(0, 60))}${x.reply_to_text.length > 60 ? "..." : ""}</span>` : ""}
        ${esc(x.text)}
        <div class="meta"><small>${fmt(x.created_at)}</small></div>
      </div>`).join("") : empty("🕊️", "مفيش ردود لسه");

    const m = await (await api("messages?select=*&order=created_at.desc")).json();
    const msgs = Array.isArray(m) ? m : [];
    $("c-msg").textContent = msgs.length;
    $("msgs").innerHTML = msgs.length ? msgs.map(x => {
      const locked = x.unlock_at && new Date(x.unlock_at) > new Date();
      return `
      <div class="card">
        ${esc(x.text.slice(0, 150))}${x.text.length > 150 ? "..." : ""}
        <div class="meta">
          <span class="badge ${x.unlock_at ? "lock" : "open"}">${x.unlock_at ? (locked ? "🔒 تتفتح: " : "🔓 اتفتحت: ") + fmt(x.unlock_at) : "✅ مفتوحة"}</span>
          <button class="del" data-id="${esc(x.id)}">حذف</button>
        </div>
      </div>`;
    }).join("") : empty("💭", "اكتب أول رسالة من فوق");
  } catch (e) {
    toast("حصلت مشكلة في التحميل", true);
  }
}

async function sendMsg() {
  const text = $("txt").value.trim();
  if (!text) return toast("اكتب الرسالة الأول", true);
  const u = $("unlock").value;
  const btn = $("sendBtn");
  busy(btn, true);
  try {
    const r = await api("messages", {
      method: "POST",
      headers: { Prefer: "return=minimal" },
      body: JSON.stringify({ text, unlock_at: u ? new Date(u).toISOString() : null })
    });
    if (!r.ok) return toast("حصل خطأ: " + (await r.text()), true);
    $("txt").value = "";
    $("unlock").value = "";
    $("cnt").textContent = "0 حرف";
    toast("اتبعتت 💌");
    load();
  } catch (e) {
    toast("مفيش اتصال بالنت، جرّب تاني", true);
  } finally {
    busy(btn, false, "إرسال 💌");
  }
}

async function del(id) {
  const r = await api("messages?id=eq." + encodeURIComponent(id), { method: "DELETE" });
  toast(r.ok ? "اتحذفت" : "ماقدرتش أحذف", !r.ok);
  load();
}

/* ---------- Events ---------- */
$("loginBtn").onclick = login;
$("logoutBtn").onclick = logout;
$("sendBtn").onclick = sendMsg;
["em", "pw"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") login(); }));
$("txt").addEventListener("input", e => $("cnt").textContent = e.target.value.length + " حرف");

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
  $("replies").hidden = t.dataset.tab !== "replies";
  $("msgs").hidden = t.dataset.tab !== "msgs";
});

// two-tap delete: first tap asks, second tap deletes
$("msgs").addEventListener("click", e => {
  const b = e.target.closest(".del");
  if (!b) return;
  if (b.classList.contains("sure")) return del(b.dataset.id);
  b.classList.add("sure");
  b.textContent = "تأكيد الحذف؟";
  setTimeout(() => { b.classList.remove("sure"); b.textContent = "حذف"; }, 3000);
});

function init() {
  if (!session) return;
  $("login").hidden = true;
  $("app").hidden = false;
  $("replies").innerHTML = skeleton;
  $("msgs").innerHTML = skeleton;
  load();
  clearInterval(timer);
  timer = setInterval(load, 15000);
}
init();
</script>
</body>
</html>
